<head>

    <title>舌尖上的中国</title>
    <link href="../static/css/fonts1.css" rel="stylesheet" />
    <link href="../static/css/fonts2.css" rel="stylesheet" />

    <style>
        .masthead:before {
            background-color: rgba(253, 197, 78, 0.85);
        }
        body:before{
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>

<body>
<video class="bg-video" playsinline="playsinline" autoplay="autoplay" muted="muted" loop="loop"><source src="../static/assets/mp4/bg2.mp4" type="video/mp4" /></video>
<div class="masthead">
    <div class="masthead-content text-white">
        <div class="container-fluid px-4 px-lg-0">
            <h1 class="fst-italic lh-1 mb-4">舌尖上的中国</h1>
            <p class="mb-5">主食是餐桌上的主要食物，是人们所需能量的主要来源。从远古时代赖以充饥的自然谷物到如今人们餐桌上丰盛的、让人垂涎欲滴的美食，一个异彩纷呈、变化多端的主食世界呈现在你面前！</p>
            <form action="/userInfo/login" id="contactForm" class="form-horizontal" method="post" role="form">
                <div class="row input-group-newsletter form-group">
                    <label for="userAccount" class="control-label col-md-3" style="margin-top: 0.5rem; font-size: 1.8rem">账 号</label>
                    <div class="col-md-8">
                        <input type="text" id="userAccount" class="form-control" name="userAccount" placeholder="请输入账号..." />
                    </div>
                </div>
                <br><br>
                <div class="row input-group-newsletter form-group">
                    <label for="userPassword" class="control-label col-md-3" style="margin-top: 0.5rem; font-size: 1.8rem">密 码</label>
                    <div class="col-md-8">
                        <input type="password" id="userPassword" class="form-control" name="userPassword" placeholder="请输入密码..." />
                    </div>
                </div>
                <br><br>
                <div class="row input-group-newsletter form-group">
                    <div class="col-md-4" style="margin-left: 10rem;">
                        <input type="submit" class="btn btn-lg btn-primary" value="登  录">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="social-icons">
    <div class="d-flex flex-row flex-lg-column justify-content-center align-items-center h-100 mt-3 mt-lg-0">
        <a class="btn btn-dark m-3" href="#!"><i class="fab fa-twitter"></i></a>
        <a class="btn btn-dark m-3" href="#!"><i class="fab fa-facebook-f"></i></a>
        <a class="btn btn-dark m-3" href="#!"><i class="fab fa-instagram"></i></a>
